<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chladni plate</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#0d0d0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --fg:#efe7d2; --bg:#0d0d0f; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none; }
  body { font:400 16px/1 "Silkscreen", ui-monospace, monospace; text-transform:uppercase; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:none; }
  #gl { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; image-rendering:pixelated; touch-action:none; cursor:crosshair; }
  #hud { position:fixed; inset:0; pointer-events:none; padding:max(20px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom)); display:grid; grid-template:auto 1fr auto / 1fr auto; gap:14px; }
  h1 { margin:0; font:700 24px/1 "Silkscreen", monospace; }
  h1, #hint, #read { justify-self:start; background:var(--bg); padding:8px 10px 7px; }
  h1 a { color:inherit; text-decoration:none; pointer-events:auto; }
  #hint { margin:0; justify-self:end; align-self:start; }
  #read { grid-row:3; align-self:end; display:block; border:2px solid var(--fg); box-shadow:3px 3px 0 var(--fg); padding:12px 14px 10px; }
  #mn { display:block; font:700 64px/.9 "Silkscreen", monospace; }
  #hz { display:block; margin-top:10px; }
  #ctl { grid-row:3; grid-column:2; align-self:end; display:grid; grid-template-columns:repeat(3, auto); gap:6px; pointer-events:auto; justify-content:end; }
  button { font:inherit; text-transform:inherit; color:var(--fg); background:var(--bg); border:2px solid var(--fg); padding:8px 10px 7px; cursor:pointer; min-width:72px; box-shadow:3px 3px 0 var(--fg); }
  button:hover, button:focus-visible, button[aria-pressed=true] { background:var(--fg); color:var(--bg); outline:none; }
  button:active { transform:translate(3px, 3px); box-shadow:none; }
  .wide { grid-column:span 3; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:4px; }
  @media (max-width:640px) {
    #hud { grid-template:auto 1fr auto auto / 1fr; }
    #hint { display:none; }
    #read { grid-row:3; } #mn { font-size:48px; } #ctl { grid-row:4; grid-column:1; justify-content:stretch; grid-template-columns:repeat(3, 1fr); }
    button { min-width:0; } .wide { grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>
<canvas id="gl" aria-label="Sand on a vibrating plate. Drag to change frequency."></canvas>
<div id="hud">
  <h1><a href="../../">Chladni</a></h1>
  <p id="hint">Drag to tune / tap to scatter</p>
  <output id="read"><span id="mn">3 x 5</span><span id="hz">404 Hz</span></output>
  <div id="ctl">
    <button data-m="1" data-n="2">1&middot;2</button><button data-m="2" data-n="3">2&middot;3</button><button data-m="3" data-n="5">3&middot;5</button>
    <button data-m="4" data-n="7">4&middot;7</button><button data-m="5" data-n="8">5&middot;8</button><button data-m="7" data-n="10">7&middot;10</button>
    <div class="wide">
      <button id="snd" aria-pressed="false">Sound</button><button id="sym" aria-label="Flip mode symmetry">+/&minus;</button><button id="sct">Scatter</button><button id="ink">Ink</button>
    </div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
